services:
  - type: web
    name: ethernal-faucet-api
    env: python
    buildCommand: pip install -r requirements-production-v2.txt
    startCommand: gunicorn api.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FAUCET_PRIVATE_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false